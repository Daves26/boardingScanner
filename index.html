
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rutas y Rumbos - Listado de Abordaje</title>

<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#bfbfbf;
font-family:Tahoma,Verdana,sans-serif;
color:#000;
padding:8px;
}
.window{
max-width:900px;
margin:auto;
background:#d4d4d4;
border:3px solid #000;
box-shadow:8px 8px 0 #000;
}
.titlebar{
background:#000;
color:#fff;
padding:8px;
font-weight:bold;
font-size:18px;
letter-spacing:1px;
}
.section{
padding:8px;
border-top:3px solid #000;
}
.camera{
position:relative;
background:#111;
border:3px solid #000;
aspect-ratio:3/4;
overflow:hidden;
}
video{
width:100%;
height:100%;
object-fit:cover;
}
#overlay{
position:absolute;
inset:0;
pointer-events:none;
}
#roi{
position:absolute;
left:11%;
top:30%;
width:78%;
height:12%;
border:3px dashed #fff;
background:rgba(255,255,255,.05);
}
#roiLabel{
position:absolute;
top:-22px;
left:0;
background:#fff;
color:#000;
padding:2px 6px;
font-size:11px;
font-weight:bold;
border:2px solid #000;
}
.cross{
position:absolute;
left:50%;
top:50%;
width:100%;
height:1px;
background:#fff;
opacity:.3;
transform:translate(-50%,-50%);
}
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
margin-top:8px;
}
.btn{
background:#fff;
border:3px solid #000;
padding:12px;
font-weight:bold;
cursor:pointer;
box-shadow:4px 4px 0 #000;
text-transform:uppercase;
}
.btn:active{
transform:translate(4px,4px);
box-shadow:none;
}
.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:8px;
}
.box{
background:#fff;
border:3px solid #000;
padding:8px;
box-shadow:4px 4px 0 #000;
text-align:center;
}
.box h3{
font-size:12px;
margin-bottom:4px;
}
.big{
font-size:28px;
font-weight:bold;
}
#last{
font-size:13px;
font-weight:bold;
word-break:break-word;
}
.status{
margin-top:8px;
background:#fff;
border:3px solid #000;
padding:8px;
font-weight:bold;
min-height:42px;
}
table{
width:100%;
border-collapse:collapse;
background:#fff;
}
th,td{
border:2px solid #000;
padding:6px;
font-size:14px;
}
th{
background:#cfcfcf;
}
.footer{
padding:8px;
text-align:center;
font-size:11px;
background:#dcdcdc;
border-top:3px solid #000;
}
#hiddenCanvas{display:none}
@media(max-width:600px){
.grid,.stats{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="window">

<div class="titlebar">
▣ RUTAS Y RUMBOS :: LISTADO DE ABORDAJE SATENA
</div>

<div class="section">

<div class="camera">
<video id="video" autoplay playsinline muted></video>

<div id="overlay">
<div id="roi">
<div id="roiLabel">NOMBRE DEL PASAJERO</div>
</div>
<div class="cross"></div>
</div>
</div>

<div class="grid">
<button class="btn" id="start">Iniciar cámara</button>
<button class="btn" id="stop">Detener</button>
<button class="btn" id="clear">Limpiar</button>
<button class="btn" id="csv">Exportar CSV</button>
</div>

<div class="stats">
<div class="box">
<h3>TOTAL</h3>
<div class="big" id="count">0</div>
</div>

<div class="box">
<h3>ÚLTIMO</h3>
<div id="last">---</div>
</div>

<div class="box">
<h3>OCR</h3>
<div id="ocrState">CARGANDO</div>
</div>
</div>

<div class="status" id="status">
Inicializando OCR...
</div>

</div>

<div class="section">

<table>
<thead>
<tr>
<th width="50">#</th>
<th>Pasajero</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<div class="footer">
RETRO WINDOWS 95 · OCR AUTOMÁTICO · SATENA LPZ → EOH
</div>

</div>

<canvas id="hiddenCanvas"></canvas>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("hiddenCanvas");
const ctx=canvas.getContext("2d",{willReadFrequently:true});

const tbody=document.getElementById("tbody");
const count=document.getElementById("count");
const last=document.getElementById("last");
const statusBox=document.getElementById("status");
const ocrState=document.getElementById("ocrState");

let worker;
let stream;
let running=false;
let busy=false;

const pasajeros=new Map();

const BLACKLIST=[
"SAN","GIL","MEDELLIN","MEDELLÍN",
"FROM","TO","DATE","TIME","BOARDING",
"GATE","CONTROL","FLIGHT","EQUIPAJE",
"PASSENGER","NAME","NOMBRE","PASAJERO"
];

function beep(){
const a=new(window.AudioContext||window.webkitAudioContext)();
const o=a.createOscillator();
const g=a.createGain();
o.type="square";
o.frequency.value=950;
o.connect(g);
g.connect(a.destination);
g.gain.value=.05;
o.start();
o.stop(a.currentTime+.09);
}

function vibrar(){
if(navigator.vibrate)navigator.vibrate(80);
}

async function initOCR(){

worker=await Tesseract.createWorker("eng");

await worker.setParameters({
tessedit_pageseg_mode:Tesseract.PSM.SINGLE_LINE,
preserve_interword_spaces:"1",
tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ/+ "
});

ocrState.innerText="LISTO";
statusBox.innerText="OCR preparado.";
}

async function startCamera(){

stream=await navigator.mediaDevices.getUserMedia({
video:{
facingMode:{ideal:"environment"},
width:{ideal:1920},
height:{ideal:1080}
},
audio:false
});

video.srcObject=stream;
await video.play();

running=true;
loop();
statusBox.innerText="Escaneando...";
}

function stopCamera(){
running=false;
if(stream){
stream.getTracks().forEach(t=>t.stop());
stream=null;
}
statusBox.innerText="Cámara detenida.";
}

function normalize(text){
return text
.replace(/\n/g," ")
.replace(/\s+/g," ")
.replace(/[^A-Z/+ ]/g,"")
.trim();
}

function extractName(text){

text=normalize(text);

const match=text.match(/([A-Z]{2,}(?: [A-Z]{2,})*)\/([A-Z+ ]{2,})/);

if(!match)return null;

const surname=match[1].trim();
const given=match[2].trim();

const combined=surname+"/"+given;

for(const w of BLACKLIST){
if(combined.includes(w))return null;
}

if(surname.length<2||given.length<2)return null;

return combined;
}

function pretty(name){
return name.split("/").map(part=>
part.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())
).join("/");
}

function addPassenger(raw){

const key=raw.replace(/\s+/g," ").trim();

if(pasajeros.has(key)){
statusBox.innerText="Duplicado: "+pretty(key);
return;
}

pasajeros.set(key,true);

const tr=document.createElement("tr");

tr.innerHTML=
`<td>${pasajeros.size}</td>
<td>${pretty(key)}</td>`;

tbody.appendChild(tr);

count.innerText=pasajeros.size;
last.innerText=pretty(key);

statusBox.innerText="✔ "+pretty(key);

beep();
vibrar();
}

async function processFrame(){

if(busy||!running)return;

busy=true;

const vw=video.videoWidth;
const vh=video.videoHeight;

const x=vw*.11;
const y=vh*.30;
const w=vw*.78;
const h=vh*.12;

canvas.width=w*1.8;
canvas.height=h*1.8;

ctx.drawImage(video,x,y,w,h,0,0,canvas.width,canvas.height);

let img=ctx.getImageData(0,0,canvas.width,canvas.height);
let d=img.data;

for(let i=0;i<d.length;i+=4){

let g=(d[i]+d[i+1]+d[i+2])/3;
g=g>150?255:0;

d[i]=g;
d[i+1]=g;
d[i+2]=g;
}

ctx.putImageData(img,0,0);

const {data:{text}}=await worker.recognize(canvas);

const name=extractName(text);

if(name){
addPassenger(name);
await new Promise(r=>setTimeout(r,700));
}

busy=false;
}

function loop(){

if(!running)return;

processFrame().finally(()=>{
setTimeout(()=>requestAnimationFrame(loop),120);
});
}

document.getElementById("start").onclick=async()=>{

if(running)return;

try{
await startCamera();
}catch(e){
statusBox.innerText="No fue posible abrir la cámara.";
}

};

document.getElementById("stop").onclick=stopCamera;

document.getElementById("clear").onclick=()=>{

pasajeros.clear();
tbody.innerHTML="";
count.innerText="0";
last.innerText="---";
statusBox.innerText="Listado vacío.";

};

document.getElementById("csv").onclick=()=>{

let csv="N,Pasajero\n";
let i=1;

for(const n of pasajeros.keys()){
csv+=`${i},"${pretty(n)}"\n`;
i++;
}

const blob=new Blob([csv],{type:"text/csv"});
const url=URL.createObjectURL(blob);

const a=document.createElement("a");
a.href=url;
a.download="listado_abordaje_satena.csv";
a.click();

URL.revokeObjectURL(url);

};

initOCR();
</script>

</body>
</html>
