<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUTAS Y RUMBOS • LISTADO DE ABORDAJE</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#c0c0c0;
font-family:Tahoma,Verdana,Arial,sans-serif;
color:#000;
}

.window{
max-width:900px;
margin:14px auto;
border:3px solid #000;
background:#efefef;
box-shadow:8px 8px 0 #000;
}

.titlebar{
background:#000;
color:#fff;
padding:8px 10px;
font-weight:bold;
letter-spacing:1px;
font-size:18px;
}

.panel{
border-top:3px solid #000;
padding:10px;
}

.camera{
position:relative;
border:3px solid #000;
background:#222;
aspect-ratio:3/4;
overflow:hidden;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:absolute;
inset:0;
pointer-events:none;
}

.scanbox{
position:absolute;
left:10%;
top:22%;
width:80%;
height:56%;
border:3px dashed #fff;
}

.cross{
position:absolute;
left:50%;
top:50%;
width:90%;
height:2px;
background:#fff;
transform:translate(-50%,-50%);
opacity:.5;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
margin-top:10px;
}

.btn{
background:#fff;
border:3px solid #000;
padding:12px;
font-weight:bold;
cursor:pointer;
box-shadow:4px 4px 0 #000;
text-transform:uppercase;
}

.btn:active{
transform:translate(4px,4px);
box-shadow:none;
}

.info{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:10px;
}

.box{
background:#fff;
border:3px solid #000;
padding:10px;
box-shadow:4px 4px 0 #000;
}

.big{
font-size:28px;
font-weight:bold;
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
}

th,td{
border:2px solid #000;
padding:8px;
font-size:14px;
}

th{
background:#d9d9d9;
}

.status{
margin-top:8px;
padding:8px;
border:2px solid #000;
background:#fff;
font-weight:bold;
}

.footer{
padding:8px;
text-align:center;
font-size:12px;
border-top:3px solid #000;
background:#dcdcdc;
}

@media(max-width:700px){
.grid,.info{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="window">

<div class="titlebar">
▣ RUTAS Y RUMBOS :: LISTADO DE ABORDAJE SATENA
</div>

<div class="panel">

<div class="camera">
<video id="video" autoplay playsinline muted></video>

<div class="overlay">
<div class="scanbox"></div>
<div class="cross"></div>
</div>
</div>

<div class="grid">
<button class="btn" id="start">INICIAR CÁMARA</button>
<button class="btn" id="stop">DETENER</button>
<button class="btn" id="clear">LIMPIAR LISTADO</button>
<button class="btn" id="csv">EXPORTAR CSV</button>
</div>

<div class="info">
<div class="box">
<div>TOTAL</div>
<div class="big" id="count">0</div>
</div>

<div class="box">
<div>ÚLTIMO</div>
<div id="last" style="font-weight:bold">---</div>
</div>

<div class="box">
<div>ESTADO</div>
<div id="engine">PDF417</div>
</div>
</div>

<div class="status" id="status">
Esperando cámara...
</div>

</div>

<div class="panel">

<table>
<thead>
<tr>
<th width="60">#</th>
<th>NOMBRE DEL PASAJERO</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<div class="footer">
RETRO WINDOWS 95 • PDF417 • ESCANEO CONTINUO
</div>

</div>

<script>
const video=document.getElementById('video');
const tbody=document.getElementById('tbody');
const count=document.getElementById('count');
const last=document.getElementById('last');
const statusEl=document.getElementById('status');
const engine=document.getElementById('engine');

let detector=null;
let stream=null;
let scanning=false;

const pasajeros=new Map();

async function iniciar(){

if(!('BarcodeDetector' in window)){
statusEl.textContent='Este navegador no soporta BarcodeDetector.';
return;
}

const formatos=await BarcodeDetector.getSupportedFormats();

if(!formatos.includes('pdf417')){
statusEl.textContent='El dispositivo no soporta PDF417.';
return;
}

engine.textContent='PDF417 NATIVO';

detector=new BarcodeDetector({formats:['pdf417']});

stream=await navigator.mediaDevices.getUserMedia({
video:{
facingMode:{ideal:'environment'},
width:{ideal:1920},
height:{ideal:1080}
},
audio:false
});

video.srcObject=stream;
await video.play();

scanning=true;
statusEl.textContent='Escaneando... acerque el pase de abordar.';
requestAnimationFrame(loop);
}

function detener(){
scanning=false;
if(stream){
stream.getTracks().forEach(t=>t.stop());
stream=null;
}
statusEl.textContent='Cámara detenida.';
}

async function loop(){

if(!scanning) return;

try{

const codes=await detector.detect(video);

for(const code of codes){

const raw=code.rawValue||'';

const nombre=extraerNombre(raw);

if(nombre){

if(!pasajeros.has(nombre)){

pasajeros.set(nombre,true);
agregar(nombre);

statusEl.textContent='✔ Agregado: '+nombre;

await vibrar();

}else{

statusEl.textContent='Duplicado ignorado: '+nombre;

}

await pausa(900);
break;

}

}

}catch(e){}

requestAnimationFrame(loop);
}

function extraerNombre(txt){

let limpio=txt.replace(/\r/g,' ').replace(/\n/g,' ');

// Busca APELLIDO/NOMBRE en el contenido del PDF417
const m=limpio.match(/([A-Z]{2,}\/[A-Z]{2,}(?:\s[A-Z]{2,})*)/);

if(m) return capitalizar(m[1]);

return null;
}

function capitalizar(t){
return t.split('/').map(p=>
p.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())
).join('/');
}

function agregar(nombre){

const tr=document.createElement('tr');

tr.innerHTML=
`<td>${pasajeros.size}</td>
<td>${nombre}</td>`;

tbody.appendChild(tr);

count.textContent=pasajeros.size;
last.textContent=nombre;
}

function pausa(ms){
return new Promise(r=>setTimeout(r,ms));
}

async function vibrar(){
if(navigator.vibrate) navigator.vibrate(120);
}

document.getElementById('start').onclick=iniciar;
document.getElementById('stop').onclick=detener;

document.getElementById('clear').onclick=()=>{
pasajeros.clear();
tbody.innerHTML='';
count.textContent='0';
last.textContent='---';
statusEl.textContent='Listado vacío.';
};

document.getElementById('csv').onclick=()=>{

let csv='N°,NOMBRE\\n';

let i=1;

for(const n of pasajeros.keys()){
csv+=`${i},"${n}"\\n`;
i++;
}

const blob=new Blob([csv],{type:'text/csv'});
const url=URL.createObjectURL(blob);

const a=document.createElement('a');
a.href=url;
a.download='listado_abordaje.csv';
a.click();

URL.revokeObjectURL(url);
};
</script>

</body>
</html>
